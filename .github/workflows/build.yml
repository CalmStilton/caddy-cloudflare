name: build
on:
  push:
    branches: [main]
  schedule:
    - cron: "23 4 * * *"   # daily: builds only if caddy:2 moved, or on Mondays
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/calmstilton/caddy-cloudflare   # lowercase is required by GHCR

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Decide whether to build
        id: decide
        run: |
          upstream=$(docker buildx imagetools inspect caddy:2 --format '{{ .Manifest.Digest }}')
          current=$(docker buildx imagetools inspect "$IMAGE:latest" \
            --format '{{ index .Image.Config.Labels "org.opencontainers.image.base.digest" }}' 2>/dev/null || true)
          echo "upstream=$upstream" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" != schedule ] \
             || [ "$(date -u +%u)" = 1 ] \
             || [ "$upstream" != "$current" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "caddy:2 unchanged ($upstream); skipping"
          fi

      - if: steps.decide.outputs.build == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build, test, push
        if: steps.decide.outputs.build == 'true'
        run: |
          docker build --pull --provenance=false --sbom=false \
            --label "org.opencontainers.image.base.digest=${{ steps.decide.outputs.upstream }}" \
            --label "org.opencontainers.image.source=https://github.com/${{ github.repository }}" \
            -t "$IMAGE:latest" .
          docker run --rm "$IMAGE:latest" caddy list-modules | grep -qx dns.providers.cloudflare
          version=$(docker run --rm "$IMAGE:latest" caddy version | awk '{print $1}' | sed 's/^v//')
          echo "Caddy $version"
          docker tag "$IMAGE:latest" "$IMAGE:$version"
          docker push "$IMAGE:latest"
          docker push "$IMAGE:$version"
